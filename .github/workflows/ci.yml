name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_ENV: "test"
      NEXT_PUBLIC_DEFAULT_TIMEZONE: "Asia/Makassar"
      NEXT_PUBLIC_SUPABASE_URL: "https://egvddkmycfbzmlafdwoc.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-for-ci-build"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "dummy-anon-key-for-ci-build"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key-for-ci-build"
      PLATFORM_ADMIN_EMAILS: "admin@patemon.id,andresanjaya0707@gmail.com"
      NEXT_PUBLIC_PAYMENT_BCA_ACCOUNT: "6115701201"
      NEXT_PUBLIC_PAYMENT_BCA_HOLDER: "I MADE ANDRE SANJAYA"
      NEXT_PUBLIC_SUPPORT_WHATSAPP_PHONE: "6289670356218"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code formatting (Prettier)
        run: pnpm format:check

      - name: Run linter (ESLint)
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run automated test suite (Vitest)
        run: pnpm test

      - name: Run Next.js production build
        run: pnpm build

